services:
  hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/data
    volumes:
      - hub-data:/data
    restart: unless-stopped

  bank:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        APP: bank
    ports:
      - "3001:80"
    restart: unless-stopped

  pharmacy:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        APP: pharmacy
    ports:
      - "3002:80"
    restart: unless-stopped

  grocery:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        APP: grocery
    ports:
      - "3003:80"
    restart: unless-stopped

volumes:
  hub-data:
